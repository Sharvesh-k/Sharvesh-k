<svg width="700" height="500" viewBox="0 0 700 500"
     xmlns="http://www.w3.org/2000/svg">

  <rect width="700" height="500" rx="12" fill="#0d1117"/>

  <!-- Border -->
  <rect x="1" y="1" width="698" height="498"
        rx="12"
        fill="none"
        stroke="#30363d"
        stroke-width="2"/>

  <!-- Terminal header -->
  <rect width="700" height="42" rx="12" fill="#161b22"/>
  <rect y="30" width="700" height="12" fill="#161b22"/>

  <!-- Terminal buttons -->
  <circle cx="20" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="21" r="6" fill="#27c93f"/>

  <!-- Terminal title -->
  <text x="350" y="27"
        text-anchor="middle"
        font-family="monospace"
        font-size="14"
        fill="#8b949e">
    sharvesh@github: ~
  </text>

  <!-- Command -->
  <text x="30" y="85"
        font-family="monospace"
        font-size="17"
        fill="#58a6ff">
    $ ./sharvesh --profile
  </text>

  <!-- Name -->
  <text x="30" y="125"
        font-family="monospace"
        font-size="26"
        font-weight="bold"
        fill="#f0f6fc">
    SHARVESH K
  </text>

  <!-- Divider -->
  <line x1="30" y1="145"
        x2="670" y2="145"
        stroke="#30363d"/>

  <!-- Role -->
  <text x="30" y="180"
        font-family="monospace"
        font-size="16"
        fill="#8b949e">
    role:
  </text>

  <text x="120" y="180"
        font-family="monospace"
        font-size="16"
        fill="#58a6ff">
    AI &amp; DATA SCIENCE STUDENT
  </text>

  <!-- Skills -->
  <text x="30" y="220"
        font-family="monospace"
        font-size="16"
        fill="#8b949e">
    skills:
  </text>

  <text x="120" y="220"
        font-family="monospace"
        font-size="16"
        fill="#f0f6fc">
    Python
  </text>

  <text x="120" y="250"
        font-family="monospace"
        font-size="16"
        fill="#f0f6fc">
    Java
  </text>

  <text x="120" y="280"
        font-family="monospace"
        font-size="16"
        fill="#f0f6fc">
    SQL
  </text>

  <text x="120" y="310"
        font-family="monospace"
        font-size="16"
        fill="#f0f6fc">
    AI / ML
  </text>

  <!-- Status -->
  <text x="30" y="355"
        font-family="monospace"
        font-size="16"
        fill="#8b949e">
    status:
  </text>

  <text x="120" y="355"
        font-family="monospace"
        font-size="16"
        fill="#3fb950">
    ● ONLINE
  </text>

  <!-- Progress -->
  <text x="30" y="395"
        font-family="monospace"
        font-size="15"
        fill="#8b949e">
    building:
  </text>

  <text x="130" y="395"
        font-family="monospace"
        font-size="15"
        fill="#58a6ff">
    ████████████████████
  </text>

  <text x="520" y="395"
        font-family="monospace"
        font-size="15"
        fill="#8b949e">
    100%
  </text>

  <!-- Footer -->
  <text x="30" y="455"
        font-family="monospace"
        font-size="14"
        fill="#8b949e">
    $ echo "keep building."
  </text>

  <text x="225" y="455"
        font-family="monospace"
        font-size="14"
        fill="#58a6ff">
    _
  </text>

</svg>
