name: Update

on:
  schedule:
    - cron: "0 0 * * *"   # Runs once every day at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "Sharvesh-k"
          git config user.email "ssharveshkj@gmail.com"

      - name: Generate 1-3 Random Commits
        run: |
        
          COMMITS=$(( ( RANDOM % 3 ) + 1 ))

          echo "Creating $COMMITS commits..."

          for ((i=1; i<=COMMITS; i++))
          do
            echo "$(date) - Update elements $i" >> activity.log

            git add activity.log

            git commit -m "Profile assets update #$i"

            sleep 2
          done

      - name: Push Changes
        run: |
          git push
