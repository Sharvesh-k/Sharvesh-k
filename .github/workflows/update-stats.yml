name: Update GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Dark Stats Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: '{"username":"${{ github.repository_owner }}","show_icons":true,"bg_color":"0D1117","title_color":"FFFFFF","text_color":"FFFFFF","icon_color":"FFFFFF","border_color":"30363D"}'
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Light Stats Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: '{"username":"${{ github.repository_owner }}","show_icons":true,"bg_color":"FFFFFF","title_color":"24292F","text_color":"24292F","icon_color":"24292F","border_color":"D0D7DE"}'
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Adaptive Language Cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          python3 <<'PY'
          import os
          import json
          import urllib.request
          from collections import defaultdict

          token = os.environ["GITHUB_TOKEN"]
          username = os.environ["GITHUB_USERNAME"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "github-actions"
          }

          def github_api(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.loads(response.read().decode())

          repositories = github_api(
              f"https://api.github.com/users/{username}/repos?per_page=100"
          )

          language_totals = defaultdict(int)

          for repo in repositories:
              if repo["fork"]:
                  continue

              languages = github_api(repo["languages_url"])

              for language, amount in languages.items():
                  language_totals[language] += amount

          language_totals = dict(
              sorted(
                  language_totals.items(),
                  key=lambda item: item[1],
                  reverse=True
              )[:6]
          )

          total = sum(language_totals.values())

          if total == 0:
              language_totals = {"No data": 1}
              total = 1

          def create_card(
              filename,
              background,
              title_color,
              text_color,
              border_color,
              colors
          ):
              width = 450
              height = 220
              bar_x = 18
              bar_y = 78
              bar_width = 384
              bar_height = 12

              svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
                  width="{width}"
                  height="{height}"
                  viewBox="0 0 {width} {height}">

                <rect width="450" height="220"
                      rx="5"
                      fill="{background}"
                      stroke="{border_color}"/>

                <text x="18" y="32"
                      font-family="Arial, Helvetica, sans-serif"
                      font-size="18"
                      font-weight="bold"
                      fill="{title_color}">
                  Most Used Languages
                </text>

                <rect x="{bar_x}" y="{bar_y}"
                      width="{bar_width}"
                      height="{bar_height}"
                      rx="6"
                      fill="{colors[-1]}"/>
              '''

              current_x = bar_x

              for index, (language, amount) in enumerate(language_totals.items()):
                  percentage = amount / total * 100
                  segment_width = bar_width * amount / total

                  svg += f'''
                  <rect x="{current_x:.2f}"
                        y="{bar_y}"
                        width="{segment_width:.2f}"
                        height="{bar_height}"
                        fill="{colors[index % len(colors)]}"/>

                  <circle cx="{18 + (index % 2) * 180}"
                          cy="{113 + (index // 2) * 30}"
                          r="4"
                          fill="{colors[index % len(colors)]}"/>

                  <text x="{28 + (index % 2) * 180}"
                        y="{117 + (index // 2) * 30}"
                        font-family="Arial, Helvetica, sans-serif"
                        font-size="11"
                        fill="{text_color}">
                    {language} {percentage:.2f}%
                  </text>
                  '''

                  current_x += segment_width

              svg += f'''
                <text x="18" y="204"
                      font-family="Arial, Helvetica, sans-serif"
                      font-size="9"
                      fill="{text_color}"
                      opacity="0.7">
                  Based on repository language usage
                </text>

              </svg>
              '''

              with open(filename, "w", encoding="utf-8") as file:
                  file.write(svg)

          os.makedirs("profile", exist_ok=True)

          create_card(
              "profile/top-langs-dark.svg",
              "#0D1117",
              "#FFFFFF",
              "#FFFFFF",
              "#30363D",
              [
                  "#FFFFFF",
                  "#BDBDBD",
                  "#929292",
                  "#686868",
                  "#454545",
                  "#303030"
              ]
          )

          create_card(
              "profile/top-langs-light.svg",
              "#FFFFFF",
              "#24292F",
              "#24292F",
              "#D0D7DE",
              [
                  "#24292F",
                  "#57606A",
                  "#6E7781",
                  "#8C959F",
                  "#AFB8C1",
                  "#D0D7DE"
              ]
          )

          print("Generated adaptive stats and language cards.")
          print(language_totals)
          PY

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update adaptive GitHub stats" || exit 0
          git push
